<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mycv</title>
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700$display=swap"
        rel="stylesheet">
</head>
<body>
    <div id="navbar-container"></div>
    
    <p class="dear">Dear Hiring Manager,<br>
        Thank you for taking the time to review my CV.<br>
        I wish you have a great day!</p>
        <div class="ajno">
        <div class="cv-buttons">

        <button
            class="cv-button active"
            onclick="showCV('cv-vietnam', this)">
            🇻🇳 CV Tiếng Việt
        </button>

        <button
            class="cv-button"
            onclick="showCV('cv-english', this)">
            🇬🇧 CV Tiếng Anh
        </button>

    </div>


    <!-- =========================
         CV
    ========================= -->

    <div class="cv-container">

        <!-- CV TIẾNG VIỆT -->
        <div id="cv-vietnam" class="cv active">
            <img
                src="https://github.com/owsabaorf-cmyk/Portfolio-ArtHbS/blob/4d7cf26fd70f1bc4fb56ba994db2a379b246631a/.vscode/cvtiengviet.png" alt="CV Tiếng Việt">
        </div>


        <!-- CV TIẾNG ANH -->
        <div id="cv-english" class="cv">
            <img
                src="https://github.com/owsabaorf-cmyk/Portfolio-ArtHbS/blob/9c760dd8b19daf9b66a1511b1e64f6b3a995e3cd/.vscode/cv.jpg" alt="CV Tiếng Anh">
        </div>

    </div>
</div>

            <img src="https://github.com/owsabaorf-cmyk/Portfolio-ArtHbS/blob/9c760dd8b19daf9b66a1511b1e64f6b3a995e3cd/.vscode/cv.jpg" alt="mycv" class="profile-image">
          <div class="Mail"> 
            <h4>Contact me at :</h4>
            <a href="mailto:nbmquan03@gmail.com" target="_blank">Send Email</a>
            <h4>Call me at :</h4>
            <a href="tel:+84335331880" class="call-btn">
                Call Me
            </a>
          </div>

<script src="navbar.js"></script>
 <script>

        function showCV(cvId, button) {

            // Ẩn tất cả CV
            document.querySelectorAll(".cv").forEach(function(cv) {
                cv.classList.remove("active");
            });


            // Bỏ trạng thái active của tất cả nút
            document.querySelectorAll(".cv-button").forEach(function(btn) {
                btn.classList.remove("active");
            });


            // Hiện CV được chọn
            document.getElementById(cvId).classList.add("active");


            // Đổi nút thành active
            button.classList.add("active");
        }

    </script>
</body>
</html>
